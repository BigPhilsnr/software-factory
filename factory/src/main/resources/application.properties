debug=false
server.address=127.0.0.1
server.port=8000
server.shutdown=graceful
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.main.banner-mode=off
spring.datasource.url=${CONTROL_DB_URL:jdbc:postgresql://localhost:5434/control}
spring.datasource.username=${CONTROL_DB_USER:control}
spring.datasource.password=${CONTROL_DB_PASSWORD:control}
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.options=-c statement_timeout=15000 -c lock_timeout=5000
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.lifecycle.timeout-per-shutdown-phase=30s
adk.agents.loader=static
adk.web.cors.origins=http://localhost:8000,http://127.0.0.1:8000
logging.config=classpath:factory-logback.xml
logging.level.root=WARN
logging.level.dev.softwarefactory=INFO
logging.level.org.springframework=WARN
logging.level.com.google.adk=WARN
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
