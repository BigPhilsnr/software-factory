# Local PostgreSQL for development and integration tests. Not a production setup.
# Both ports are published on 127.0.0.1 only. Passwords come from .env (see .env.example) and are
# applied only when a volume is first created; later changes need ALTER ROLE or a new volume.
#   Start: docker-compose up -d shortener-db control-db      Stop: docker-compose down
#   Delete the data as well: docker-compose down -v
services:
  # Product data (links, redirect counters). Used by shortener/ on port 5433.
  shortener-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shortener
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: ${SHORTENER_DB_PASSWORD:-shortener}
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - shortener-data:/var/lib/postgresql/data
  # Factory control data (run state, audit chain, chat budget). Used by factory/ on port 5434.
  # Kept separate so that nothing the factory works on can reach its own record.
  control-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: control
      POSTGRES_USER: control
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD:-control}
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U control -d control"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - control-data:/var/lib/postgresql/data
volumes:
  shortener-data:
  control-data:
