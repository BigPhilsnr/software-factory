server:
  port: ${SHORTENER_PORT:8080}
spring:
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SHORTENER_DB_URL:jdbc:postgresql://localhost:5433/shortener}
    username: ${SHORTENER_DB_USER:shortener}
    password: ${SHORTENER_DB_PASSWORD:shortener}
    hikari:
      maximum-pool-size: 8
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}
